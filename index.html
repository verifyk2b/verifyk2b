<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Krumbs 2 Bricks</title>

  <style>
    :root {
      --green: #bef264;
      --jupiter: #20c997;
      --phantom: #ab9ff2;
      --solflare: #ffc83d;
      --orange: #f97316;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #000000;
      color: #ffffff;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .page {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* HERO */

    .hero {
      width: 100%;
      margin: 0 auto 24px;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* BUTTONS */

    .actions {
      width: 100%;
      max-width: 760px;

      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 12px;
    }

    .btn {
      display: flex;

      min-height: 56px;

      align-items: center;
      justify-content: center;

      padding: 14px 18px;

      border-radius: 12px;

      color: #ffffff;

      font-size: 15px;
      font-weight: 800;

      text-align: center;
      text-decoration: none;
    }

    .pumpfun {
      background: var(--green);
      color: #000000;
    }

    .jupiter {
      background: var(--jupiter);
      color: #000000;
    }

    .phantom {
      background: var(--phantom);
      color: #000000;
    }

    .solflare {
      background: var(--solflare);
      color: #000000;
    }

    .verify {
      background: #111827;
      border: 2px solid var(--orange);
    }

    .orca {
      background: #111827;
      border: 1px solid #374151;
    }

    .telegram {
      grid-column: 1 / -1;
      background: #0b1220;
      border: 1px solid #374151;
    }

    /* MOBILE */

    @media (max-width: 620px) {
      .page {
        padding: 12px;
      }

      .hero {
        margin-bottom: 18px;
      }

      .actions {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .telegram {
        grid-column: auto;
      }

      .btn {
        min-height: 54px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- HERO -->

    <section class="hero">

      <img
        class="hero-image"
        src="./k2b-hero.webp"
        alt="Krumbs 2 Bricks"
      >

    </section>


    <!-- BUTTONS -->

    <section class="actions">

      <a
        class="btn pumpfun"
        href="https://pump.fun/At4L287tND4vLSURFeVz2fqhbvNgnE76nfFg7gy9pump"
        target="_blank"
        rel="noopener noreferrer"
      >
        PUMP.FUN
      </a>

      <a
        class="btn jupiter"
        href="https://jup.ag/tokens/At4L287tND4vLSURFeVz2fqhbvNgnE76nfFg7gy9pump"
        target="_blank"
        rel="noopener noreferrer"
      >
        JUPITER
      </a>

      <a
        class="btn phantom"
        href="https://phantom.com/tokens/solana/At4L287tND4vLSURFeVz2fqhbvNgnE76nfFg7gy9pump"
        target="_blank"
        rel="noopener noreferrer"
      >
        PHANTOM
      </a>

      <a
        class="btn solflare"
        href="https://www.solflare.com/prices/krumbs-2-bricks/At4L287tND4vLSURFeVz2fqhbvNgnE76nfFg7gy9pump"
        target="_blank"
        rel="noopener noreferrer"
      >
        SOLFLARE
      </a>

      <a
        class="btn verify"
        href="https://verifyk2b.github.io/verifyk2b/verify/"
        target="_blank"
        rel="noopener noreferrer"
      >
        VERIFICATION HUB
      </a>

      <a
        class="btn orca"
        href="https://solscan.io/account/4YXiuFu5qWDeUqKAMGFbSAM1eimADvjsS3HW2k7EqYnh"
        target="_blank"
        rel="noopener noreferrer"
      >
        ORCA LIQUIDITY POOL
      </a>

      <a
        class="btn telegram"
        href="https://t.me/YOUR_TELEGRAM"
        target="_blank"
        rel="noopener noreferrer"
      >
        TELEGRAM
      </a>

    </section>

  </div>

</body>
</html>
